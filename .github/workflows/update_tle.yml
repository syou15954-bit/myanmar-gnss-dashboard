name: Update TLE Cache

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  update-tle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch TLE data from CelesTrak
        run: |
          mkdir -p backend
          curl -s "https://celestrak.org/NORAD/elements/gp.php?GROUP=gnss&FORMAT=tle" -o backend/tle_cache.txt

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/tle_cache.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TLE cache data" && git push)